    - Bottom navigator exposes Home, Explore, and My only.
    - The floating plus button remains the primary entry for creating a new blank recipe/shoot-board.
    - User-facing CTA language is recipe creation, not shoot creation.
    - Home exposes continue, recipe creation, and owned recipe card access.
