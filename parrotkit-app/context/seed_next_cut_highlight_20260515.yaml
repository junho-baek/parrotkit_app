metadata:
  seed_id: parrotkit_next_cut_highlight_20260515
  name: parrotkit_next_cut_highlight
  version: "1.1.0"
  source_session_id: orch_173aee3a5c82
  source_job_id: job_459be55ab179
  created_at: "2026-05-15"
  updated_at: "2026-05-15"
  update_reason: User clarified that auto-opening/focusing the next cut is inconvenient; guidance should be passive.

goal: >
  Finish ParrotKit board overview Resume UX: when Home Continue opens a board,
  the overview may indicate the next required cut without a saved My Take, but
  must not auto-open, auto-expand, scroll-focus, or force attention onto that cut.
  Camera entry remains user-initiated.

task_type: code

constraints:
  - "Continue lands on the shooting board overview, not camera."
  - "Do not auto-open, auto-expand, scroll-focus, or force-highlight a cut when the board opens."
  - "If next-cut guidance is shown, keep it passive and lightweight: small marker, ordering, or subtle affordance only."
  - "The board must remain calm and scannable; users choose which cut to open."
  - "Keep iPhone simulator layout stable; avoid bottom nav/FAB overlap."
  - "Preserve Home/Explore/My nav and 레시피 생성 CTA."
  - "Keep changes minimal and focused on board overview UI."
  - "Do not run this seed automatically; this seed is for GitHub issue publishing/tracking."

acceptance_criteria:
  - "next_required_cut_resolved: Board overview can identify the next required cut lacking saved My Take."
  - "passive_guidance_only: Any next-cut indication is subtle and non-disruptive, such as a small Next marker or gentle ordering."
  - "no_auto_expand: Continue-opened board does not automatically expand/open the next cut toggle."
  - "no_auto_focus: Continue-opened board does not scroll-focus, jump, or force visual focus onto the next cut."
  - "no_camera_jump: Camera does not open until the user taps a cut/camera action."
  - "manual_choice_preserved: Users can scan and choose any cut without the UI steering them too aggressively."
  - "fallback_empty_state: If all required cuts have My Take, overview does not show a misleading next-cut marker."
  - "tests_or_qa: Focused component test or simulator QA evidence verifies no auto-open/focus and passive next marker behavior."
  - "verification: TypeScript check passes and implementation report is written under context/."

ontology_schema:
  name: ParrotKitNextCutPassiveGuidance
  description: Passive board overview guidance for the next required cut needing My Take.
  fields:
    - name: board_id
      type: string
      description: Recipe board opened from Home Continue.
      required: true
    - name: next_required_cut_id
      type: string
      description: First/priority required cut without saved My Take.
      required: false
    - name: guidance_state
      type: string
      description: Passive treatment for the next cut, e.g. none, marker, or subtle_ordering.
      required: true
    - name: auto_expand_disabled
      type: boolean
      description: Whether the board avoids automatically opening the next cut.
      required: true
    - name: auto_focus_disabled
      type: boolean
      description: Whether the board avoids scroll/focus jumps on open.
      required: true
    - name: camera_entry_requires_tap
      type: boolean
      description: Whether camera opens only after user taps a cut/action.
      required: true

exit_conditions:
  - name: passive_next_cut_guidance_verified
    description: Continue-opened board remains calm while optionally indicating the next required cut.
    criteria: Board overview does not auto-open/focus a cut and only uses passive next-cut guidance when helpful.
