    .label { fill: #334155; font: 800 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .note { fill: #64748b; font: 600 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .frame { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 18; }
  </style>
  <rect class="bg" width="920" height="760"/>
