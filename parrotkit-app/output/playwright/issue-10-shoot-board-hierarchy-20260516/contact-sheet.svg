  <image href="android-board-overview.png" x="88" y="148" width="300" height="560" preserveAspectRatio="xMidYMin meet"/>
  <rect x="482" y="96" width="410" height="630" class="frame"/>
  <text x="502" y="124" class="label">iPhone</text>
  <image href="ios-board-overview.png" x="532" y="148" width="310" height="560" preserveAspectRatio="xMidYMin meet"/>
