goal: Implement and verify a ParrotKit vertical slice where one real YouTube Shorts
  reference generates transcript-grounded sourceFaithful and goalAdapted recipe variants,
  an immutable Breakdown artifact, a compact Shooting Board projection, immediate
  UI reflection of the latest API response, and cut-level YouTube timestamp jumping.
task_type: code
