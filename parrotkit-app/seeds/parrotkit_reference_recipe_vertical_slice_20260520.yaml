product_decisions:
  recipe_quality_target:
  - Good recipes preserve the source transcript's rhetorical structure, beat order,
    contrast, numbers, repetition, and voice.
  - Adaptation may change niche/goal copy, but if the output could have been generated
    without reading the transcript it fails quality.
  - The source transcript is the anchor; provider/model output is not trusted as the
    final app contract.
  variants:
    generate_both: true
    sourceFaithful:
      role: Default Board variant for learning from the reference.
      requirements:
      - Preserve source transcript structure and beat order.
      - Use placeholders/templates such as "{basic_action}", "{intense_action}", "{product}",
        "{customer_context}" where useful.
      - Retain at least one source-specific phrase, number, repetition, or contrast
        in every cut as template or mapped phrase.
    goalAdapted:
      role: Shootable adaptation for the user's niche/goal.
      requirements:
      - Keep the same source skeleton.
      - Rewrite copy and scene instructions so the result feels natural for the target
        niche/goal.
      - Remain traceable to source beats and timestamps.
  board_default: sourceFaithful
  board_variant_switching:
    v1_behavior: Same recipe, same screen, switch variant in-place.
    future_behavior: Save adapted as new recipe may be added later.
    preferred_labels:
    - Original style
    - Adapted
    - Source
    - Goal
    - Adapt to my goal
  reference_playback:
    v1_required:
    - Cut/scene-level timestamp jump is required.
    - Embedded player is not required in v1; opening external YouTube links with t=seconds
      is acceptable.
    - Each cut must clearly point back to the original source time range.
    future_note:
    - For Instagram/TikTok and richer playback, reference media may come from user-provided
      mp4 during recipe creation; out of scope for this seed.
  ui_source_of_truth:
    policy: Optimistic UI uses latest API response immediately, then reconciles with
      persisted DB/hydrated state.
    requirements:
    - Generated API response must not be overwritten by stale mock/local cached recipe.
    - If persisted hydrate races with a generated result, prefer latest generatedAt/requestId.
    - Re-entry/app restart may read persisted recipe after save completes.
  implementation_priority: vertical_slice
  validation_link_policy:
    automated_tests: fixture-based, at least two deterministic fixtures.
    live_smoke: one real link is enough for acceptance because external APIs are slow/flaky.
breakdown_information_architecture:
  principle: Breakdown preserves full analysis; Board remains compact execution-first.
  required_sections:
  - id: original_analysis
    label: Original Analysis / 원본 분석
    contents:
    - actual clean transcript
    - original hook
    - original storytelling structure
    - original visual layout
    - source-specific contrast/repetition/numbers/voice
    - why the source works
  - id: extracted_structure
    label: Extracted Structure / 구조 템플릿
    contents:
    - reusable source skeleton
    - placeholders for replaceable variables
    - source-faithful mapping
  - id: apply_to_your_content
    label: Apply to Your Content / 내 콘텐츠에 적용하기
    contents:
    - how the source structure maps to the target niche/goal
    - what is preserved and what changes
    - goalAdapted mapping
  - id: hook
    label: Hook
    contents:
    - original hook
    - sourceFaithful hook
    - goalAdapted hook
  - id: storytelling_structure
    label: Storytelling Structure
    contents:
    - original progression
    - transformed progression
    - scene/cut mapping
  - id: visual_layout
    label: Visual Layout
    contents:
    - source visual beats when available
    - practical shooting layout
    - thumbnail/preview/timestamp linkage
  transcript_rule: A section labeled Transcript must show the actual transcript or
    transcript excerpts. Analysis prose belongs under Apply to Your Content, Idea
    Analysis, or Notes.
backend_contract_requirements:
  provider_pipeline:
  - Supadata/SuperData is metadata/transcript/script ingestion first, not a required
    visual analyzer.
  - Visual extract is optional enrichment and must not block usable transcript-based
    results.
  - LLM generates a small draft only; Go deterministically builds ReferenceAnalysisResponse.
  - Provider metadata, debug traces, prompts, stack traces, and raw diagnostics remain
    internal.
  statuses:
  - If transcript-derived recipe/cutBoard is usable, return ready or partial_ready
    even if optional visual extract fails.
  - Stable app errors such as model_invalid_output must be preserved when truly unrecoverable.
  canonical_response:
    top_level_fields:
    - schemaVersion
    - status
    - referenceMedia
    - breakdown
    - recipe
    - cutBoard
    - generation
  cut_count:
  - Do not hard-code exactly 3 cuts.
  - Normal short-form output may target 3-6 cuts, but count must come from transcript
    structure and draft evidence.
  - Investigate and test that no server or UI code forces stale 4-cut or fixed 3-cut
    output.
  timestamp_mapping:
  - Do not synthesize reference timestamps by evenly accumulating generated scene
    durations when transcript timestamps exist.
  - Source-faithful cuts must map to actual transcript segment start/end times or
    documented derived spans.
  - Each cutBoard item must include a reference time range usable for YouTube t=seconds
    links.
ui_requirements:
  board:
  - Default to sourceFaithful.
  - Provide clear variant switching to goalAdapted in the same recipe.
  - Header cut count must equal cutBoard.items.length for the selected/latest generated
    result.
  - Keep copy short, concrete, and creator-facing.
  - No console/admin/provider/debug language.
  - No Sandcastle labels, Proof Point label, confidence, prompt, raw provider trace,
    or box-in-box clutter.
  breakdown:
  - Show actual clean transcript in Transcript.
  - Show original analysis -> extracted structure -> apply to your content -> variants
    mapping.
  - Long sections may be collapsed, but data must be present.
  reference_video:
  - Cut actions open the original YouTube URL at the cut's source timestamp in v1.
  - No dead play buttons; unavailable embedded playback must degrade to explicit external
    timestamp open.
