detailed_acceptance_criteria:
- name: Two-variant generation
  criteria:
  - For fixture inputs, backend returns both sourceFaithful and goalAdapted variants.
  - Board default projection is sourceFaithful.
  - Goal-adapted projection can be selected without creating a new recipe.
- name: Source-faithful quality
  criteria:
  - Every sourceFaithful cut preserves the original transcript rhetorical structure.
  - Every sourceFaithful cut retains at least one source-specific phrase, number,
    repetition, or contrast as template or mapped phrase.
  - Every sourceFaithful cut links to a concrete source timestamp/transcript span.
- name: Breakdown correctness
  criteria:
  - Breakdown Transcript contains actual clean transcript or excerpts, not analysis
    prose.
  - Breakdown includes Original Analysis, Extracted Structure, Apply to Your Content,
    Hook, Storytelling Structure, and Visual Layout sections or equivalent contract
    fields.
  - SourceFaithful and goalAdapted mappings are traceable from the same source skeleton.
- name: Timestamp and playback
  criteria:
  - CutBoard items include source time ranges derived from transcript timestamps when
    available.
  - v1 UI can open the original YouTube link at the selected cut timestamp.
  - Generated duration accumulation is not used as the primary timestamp source when
    transcript timestamps exist.
- name: UI freshness
  criteria:
  - Immediately after generation, the screen renders the latest API response, not
    stale mock/cache/previous recipe data.
  - Header cut count, board cards, breakdown transcript, and selected variant all
    match the latest generated response.
  - Later DB hydrate reconciles without overwriting newer generatedAt/requestId data.
- name: Partial usability
  criteria:
  - Transcript success plus optional visual extract failure yields ready or partial_ready
    when recipe/cutBoard are usable.
  - Optional provider failures are recorded internally without leaking debug traces
    to UI.
- name: Live vertical-slice smoke
  criteria:
  - With credentials present, the primary vertical-slice link returns ready or usable
    partial_ready.
  - The response is not failed/model_invalid_output.
  - The result contains transcript-grounded sourceFaithful and goalAdapted variants,
    real timestamp mapping, and a compact board projection.
ontology_schema:
  name: ParrotKitReferenceRecipeVerticalSlice
  description: Transcript-grounded reference recipe generation from source media to
    immutable Breakdown and compact Shooting Board variants.
  fields:
  - name: reference_url
    type: string
    description: Source short-form URL used for live smoke and timestamp links.
    required: true
  - name: source_transcript
    type: object
    description: Clean transcript with timestamp spans used as evidence for cuts.
    required: true
  - name: sourceFaithful
    type: object
    description: Default board variant preserving source structure, wording patterns,
      numbers, and repetition.
    required: true
  - name: goalAdapted
    type: object
    description: Same source skeleton adapted to target niche and goal.
    required: true
  - name: breakdown
    type: object
    description: Immutable analysis artifact containing transcript, original analysis,
      extracted template, apply guidance, hooks, storytelling, visual layout, and
      variant mapping.
    required: true
  - name: cutBoard
    type: object
    description: Compact execution-first projection with source timestamp ranges and
      variant switching.
    required: true
  - name: ui_source_of_truth
    type: string
    description: Latest API response wins immediately, persisted hydrate reconciles
      later.
    required: true
constraints:
- 'No AI-slop design: UI copy and visuals must stay compact, concrete, source-grounded,
  brand-native, and must avoid generic AI labels, decorative progress, console/debug/provider
  language, Proof Point/Sandcastle labels, confidence badges, and box-in-box clutter.
  Placeholder/template braces are not AI slop when they appear in the correct layer:
  sourceFaithful recipe cuts and Breakdown Extracted Structure must expose reusable
  {placeholder} templates such as {basic_action}, {intense_action}, {product}, or
  {customer_context}; goalAdapted final shooting copy should normally be natural complete
  copy and may omit braces. Do not strip required braces from sourceFaithful or extractedStructure
  as a cleanup/design-polish step.'
- Run from the repository root. The seed file may live in seeds/, but shell commands
  must use /Users/junho/project/parrotkit-app as the working directory; do not use
  the seed directory as the project root.
- Use focused verification commands listed in verification_plan.local_tests. Do not
  call generic npm test because it is intentionally undefined in parrotkit-app.
