  projection can be selected without creating a new recipe.'
- 'Source-faithful quality: Every sourceFaithful cut preserves the original transcript
  rhetorical structure.; Every sourceFaithful cut retains at least one source-specific
  phrase, number, repetition, or contrast as template or mapped phrase.; Every sourceFaithful
  cut links to a concrete source timestamp/transcript span.'
- 'Breakdown correctness: Breakdown Transcript contains actual clean transcript or
  excerpts, not analysis prose.; Breakdown includes Original Analysis, Extracted Structure,
  Apply to Your Content, Hook, Storytelling Structure, and Visual Layout sections
  or equivalent contract fields.; SourceFaithful and goalAdapted mappings are traceable
  from the same source skeleton.'
- 'Timestamp and playback: CutBoard items include source time ranges derived from
  transcript timestamps when available.; v1 UI can open the original YouTube link
  at the selected cut timestamp.; Generated duration accumulation is not used as the
  primary timestamp source when transcript timestamps exist.'
- 'UI freshness: Immediately after generation, the screen renders the latest API response,
  not stale mock/cache/previous recipe data.; Header cut count, board cards, breakdown
  transcript, and selected variant all match the latest generated response.; Later
